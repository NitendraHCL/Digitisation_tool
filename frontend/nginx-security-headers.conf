# Nginx Security Headers Configuration
# Place this file in /etc/nginx/conf.d/ or include it in your server block
#
# Usage:
#   server {
#       include /path/to/nginx-security-headers.conf;
#   }

# Content Security Policy
# Adjust 'unsafe-inline' and 'unsafe-eval' based on your actual needs
# Remove them if possible after testing
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.yourdomain.com; frame-ancestors 'self'; form-action 'self'; base-uri 'self'; object-src 'none'" always;

# Prevent clickjacking
add_header X-Frame-Options "SAMEORIGIN" always;

# Prevent MIME type sniffing
add_header X-Content-Type-Options "nosniff" always;

# Enable HSTS (HTTP Strict Transport Security)
# Only enable this in production with valid SSL certificate
# preload requires domain to be submitted to https://hstspreload.org/
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# Referrer Policy
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Permissions Policy (formerly Feature-Policy)
# Disable unused browser features
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=()" always;

# Cross-Origin Policies (Spectre mitigation)
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;

# Remove server version information
server_tokens off;

# Disable unnecessary HTTP methods
if ($request_method !~ ^(GET|POST|PUT|DELETE|PATCH|HEAD|OPTIONS)$) {
    return 405;
}

# Additional security configurations
# Prevent access to hidden files
location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
}

# CORS configuration (if needed)
# Uncomment and adjust for your API domain
# add_header Access-Control-Allow-Origin "https://yourdomain.com" always;
# add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
# add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
# add_header Access-Control-Allow-Credentials "true" always;
